name: coconut_app
description: A Flutter app for coconut variety detection
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.0.17
  
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.2 

  # HTTP requests (API calls to Laravel backend)
  http: ^1.1.0
 
  geolocator: ^13.0.1  # For GPS coordinates
  geocoding: ^3.0.0    # For converting coordinates to addresses

  shared_preferences: ^2.1.0

  # UI icons
  cupertino_icons: ^1.0.8

  # Modern TensorFlow Lite Engine
  tflite_flutter: ^0.10.4


  # Camera support
  camera: ^0.10.6

  # Image picker (gallery & camera)
  image_picker: ^1.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0  # Kept compatible with SDK 3.x
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.jpg"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "logo.jpg"
    background_color: "#2E7D32"
    theme_color: "#2E7D32"
  windows:
    generate: true
    image_path: "logo.jpg"
  macos:
    generate: true
    image_path: "logo.jpg"

flutter_native_splash:
  color: "#FFFFFF"
  image: "logo.jpg"
  android: true
  ios: true
  web: true
  android_12:
    color: "#FFFFFF"
    image: "logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - logo.jpg
    - assets/models/coconut_variety_model.tflite
    - assets/models/coconut_labels.txt